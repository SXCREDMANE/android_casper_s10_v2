name: Compile TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Workflow
      uses: actions/checkout@v4

    - name: Clean and Prepare Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
        sudo apt-get clean
        echo "Free space after cleanup:"
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          g++-multilib gcc-multilib lib32readline-dev lib32z1-dev \
          bison flex git-core gnupg build-essential zip curl zlib1g-dev \
          libc6-dev-i386 x11proto-core-dev libx11-dev libgl1-mesa-dev \
          libxml2-utils xsltproc unzip python3 openjdk-8-jdk

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize and Sync TWRP Source
      run: |
        mkdir -p ~/twrp && cd ~/twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-6.0 --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd ~/twrp
        git clone https://github.com/${{ github.repository }} device/casper/s10_v2

    - name: Build TWRP Recovery Image
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch omni_s10_v2-eng
        make recoveryimage -j$(nproc --all)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Casper_S10_V2
        path: /home/runner/twrp/out/target/product/s10_v2/recovery.img
